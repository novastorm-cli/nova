<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova CI Fixture</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 40rem;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 { margin-bottom: 0.5rem; }
    #add-csv-export {
      padding: 0.6rem 1.2rem;
      background: #0070f3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    nav { margin-top: 2rem; }
  </style>
</head>
<body>
  <header>
    <h1>Nova CI Fixture</h1>
    <p>Minimal static fixture for Playwright E2E smoke tests in CI.</p>
  </header>

  <section style="margin-top: 1.5rem">
    <button id="add-csv-export" type="button">
      Add CSV export
    </button>
  </section>

  <section style="margin-top: 2rem">
    <h2>Data list</h2>
    <ul>
      <li><strong>Quasar</strong> — active</li>
      <li><strong>Pulsar</strong> — dormant</li>
      <li><strong>Nebula</strong> — active</li>
      <li><strong>Supernova</strong> — expired</li>
    </ul>
  </section>

  <nav>
    <a href="/admin">Go to /admin</a>
  </nav>
</body>
</html>
